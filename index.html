<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><link rel="icon" href="data:," /><title>Voxel Crossing PoC</title></head>
<body><main id="app"><div id="hud" aria-live="polite"><div class="hud-row"><span id="mode-label">Baseline Mode</span><button id="mode-toggle" type="button">Switch to Voxel Mode</button></div><div class="hud-row telemetry"><span id="telemetry-frame">Frame —</span><span id="telemetry-draw">Draw —</span><span id="telemetry-triangles">Triangles —</span></div><div class="hud-row markers" aria-label="Fixed comparison cameras"><span>Views:</span><button class="marker-button" data-marker="overview" type="button">1 Overview</button><button class="marker-button" data-marker="crossing" type="button">2 Crossing</button><button class="marker-button" data-marker="railway" type="button">3 Railway</button><span id="active-marker">Free</span></div><div class="hud-row interaction-row"><button id="interaction-prompt" type="button" hidden>No interaction in range</button><span id="interaction-state">No interaction in range</span></div><fieldset id="benchmark-controls"><legend>Benchmark</legend><div class="hud-row"><button id="benchmark-run" type="button">Run standard</button><button id="benchmark-diagnostic" type="button">Run diagnostic</button><button id="benchmark-cancel" type="button" hidden>Cancel</button><button id="benchmark-download" type="button" hidden>Download JSON</button><span id="benchmark-status">Benchmark idle</span></div><div class="hud-row"><label>Profile <input id="benchmark-profile" value="local-reference" maxlength="80" /></label><label>Hardware / power <input id="benchmark-power" placeholder="e.g. plugged in, performance" maxlength="160" /></label></div></fieldset><p id="controls-hint">WASD / arrows move · E activates nearby interaction · click scene for mouse look · Esc releases mouse</p></div><div id="scene-root" aria-label="Japanese suburban crossing scene"></div></main><script type="module" src="/src/main.ts"></script></body></html>
